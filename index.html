<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sketch">
<meta name="theme-color" content="#1f3a32">
<link rel="apple-touch-icon" id="touchIcon" href="">
<link rel="manifest" id="pwaManifest" href="">
<title>Sketch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Pen+Script&family=Great+Vibes&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: a cloth-bound album cover up top, the mode shelf and photo index below; viewing happens on a dark full-screen "projection" stage. */
:root{
  --bg:#eceeea; --surface:#fbfbf9; --ink:#1d2421; --muted:#5d6963; --line:#d3d9d4;
  --accent:#2f5d50; --accent-ink:#ffffff; --foil:#b38a33; --cloth:#2c4f45; --cloth-2:#25443b;
  --danger:#a5382b; --stage:#0d0f0e; --stage-ink:#f2f2ee;
  --f-display:"Gowun Batang","Nanum Myeongjo",serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-hand:"Nanum Pen Script","Gowun Batang",cursive;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121614; --surface:#1a201d; --ink:#e6ebe7; --muted:#9aa69f; --line:#2c3530;
  --accent:#7fb8a5; --accent-ink:#0f1a16; --foil:#d4b264; --cloth:#1f3a32; --cloth-2:#18302a;
  --danger:#e07a6c; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1a201d; --ink:#e6ebe7; --muted:#9aa69f; --line:#2c3530;
  --accent:#7fb8a5; --accent-ink:#0f1a16; --foil:#d4b264; --cloth:#1f3a32; --cloth-2:#18302a;
  --danger:#e07a6c; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
.admin{display:flex;justify-content:center}
.link-btn{background:none;border:0;color:var(--muted);font-size:.8rem;text-decoration:underline;padding:8px}
#adminForm{max-width:340px;width:100%;margin:0 auto}
#adminForm .err{color:var(--danger);font-size:.82rem;margin:0;min-height:1.2em}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.viewing{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding-block:20px 56px;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h2{font-size:1.25rem}
.eyebrow{font-size:.74rem;letter-spacing:.12em;color:var(--muted);font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);
  padding:10px 16px;border-radius:999px;font-weight:500;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.btn:disabled{opacity:.5;cursor:default}
.note{font-size:.85rem;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);padding:10px 14px}

/* ---------- Cover ---------- */
.cover{position:relative;border-radius:6px 14px 14px 6px;overflow:hidden;color:#efe6cf;
  background:
    repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 1px,transparent 1px 3px),
    linear-gradient(160deg,var(--cloth),var(--cloth-2));
  box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 18px 40px -22px rgba(0,0,0,.55);
  padding:44px 24px 36px 46px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:22px;
  background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.06) 60%,rgba(0,0,0,.25))}
.cover .frame{position:absolute;inset:14px 14px 14px 36px;border:1px solid color-mix(in srgb,var(--foil) 55%,transparent);border-radius:4px 8px 8px 4px;pointer-events:none}
.logo{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;overflow:hidden;
  border:2px solid var(--foil);box-shadow:0 0 0 4px rgba(0,0,0,.12) inset;background:rgba(0,0,0,.15)}
.logo img{width:100%;height:100%;object-fit:cover}
.logo span{font-family:var(--f-display);font-size:2.4rem;font-weight:700;color:var(--foil)}
.cover h1{font-family:"Great Vibes","Gowun Batang",cursive,serif;font-size:clamp(3rem,11vw,4.6rem);font-weight:400;letter-spacing:0;line-height:1.15;padding-inline:.15em;
  color:var(--foil);text-shadow:0 1px 0 rgba(0,0,0,.35)}
.cover .sub{font-family:var(--f-display);font-size:1.05rem;opacity:.85;max-width:32ch}
.cover .meta{font-size:.8rem;letter-spacing:.14em;opacity:.7;font-variant-numeric:tabular-nums}
.cover-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px;position:relative}
.cover .btn{border-color:color-mix(in srgb,var(--foil) 60%,transparent);background:rgba(0,0,0,.18);color:#f3ead2}
.cover .btn.primary{background:var(--foil);border-color:var(--foil);color:#1d1a12}

/* ---------- Mode shelf ---------- */
.section{display:flex;flex-direction:column;gap:14px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:620px){.modes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mode{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);
  background:var(--surface);border-radius:var(--r);padding:12px 12px 14px}
.mode input{position:absolute;opacity:0;pointer-events:none}
.mode .glyph{height:54px;border-radius:6px;background:color-mix(in srgb,var(--accent) 10%,var(--bg));position:relative;overflow:hidden}
.mode b{font-weight:700;font-size:.95rem}
.mode small{color:var(--muted);font-size:.8rem;line-height:1.45}
.mode:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.mode:has(input:checked) .glyph::after{content:"선택됨";position:absolute;right:6px;top:6px;font-size:.68rem;background:var(--accent);color:var(--accent-ink);padding:1px 7px;border-radius:999px}
.mode:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.g-card{position:absolute;width:34%;height:62%;top:19%;border-radius:3px;background:color-mix(in srgb,var(--accent) 55%,var(--surface))}
.g-card.b{background:color-mix(in srgb,var(--foil) 60%,var(--surface))}

/* ---------- Thumb index ---------- */
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:1;max-width:100%;border:0;padding:0;border-radius:6px;overflow:hidden;background:var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb span{position:absolute;left:6px;bottom:4px;font-size:.72rem;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);font-variant-numeric:tabular-nums}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}

/* ---------- Editor ---------- */
.ed-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px;border-bottom:1px solid var(--line)}
body.editing::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.save-state{font-size:.8rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.82rem;font-weight:500;color:var(--muted)}
.field input,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;width:100%}
.logo-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo-row .logo{width:72px;height:72px;background:var(--cloth)}
.logo-row .logo span{font-size:1.8rem}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--muted)}
.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.progress{font-size:.85rem;color:var(--accent);font-variant-numeric:tabular-nums}
.plist{display:flex;flex-direction:column;gap:10px;list-style:none;padding:0;margin:0}
.prow{display:grid;grid-template-columns:auto 112px minmax(0,1fr);gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.prow .num{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem;padding-top:4px;min-width:1.6em}
.prow .pimg{width:112px;aspect-ratio:1;max-width:100%;border-radius:6px;overflow:hidden;border:0;padding:0;background:var(--line)}
.prow .pimg img{width:100%;height:100%;object-fit:cover;display:block}
.prow .pfields{display:flex;flex-direction:column;gap:8px;min-width:0}
.prow textarea{min-height:64px;resize:vertical}
.prow .tools{display:flex;gap:6px;flex-wrap:wrap}
.tool{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;font-size:.82rem;min-height:36px}
.tool:hover{border-color:var(--accent)}
.tool.del{color:var(--danger)}
.tool.confirm{background:var(--danger);color:#fff;border-color:var(--danger)}
@media (max-width:520px){
  .prow{grid-template-columns:84px minmax(0,1fr)}
  .prow .num{display:none}
  .prow .pimg{width:84px}
}

/* ---------- Viewer stage ---------- */
#viewer{position:fixed;inset:0;z-index:50;background:var(--stage);color:var(--stage-ink);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#stage{position:absolute;inset:0;perspective:1600px}
.chrome{position:absolute;left:0;right:0;z-index:5;display:flex;align-items:center;gap:8px;transition:opacity .35s}
.top{top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) max(14px,env(safe-area-inset-right,0px)) 26px max(14px,env(safe-area-inset-left,0px));
  background:linear-gradient(rgba(0,0,0,.6),transparent)}
.top .ttl{flex:1;min-width:0;font-family:var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1rem}
.vbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:var(--stage-ink);border-radius:999px;min-width:40px;height:40px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:.85rem}
.vbtn:hover{background:rgba(255,255,255,.22)}
.vsel{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:var(--stage-ink);border-radius:999px;height:40px;padding:0 10px;max-width:9.5em}
.vsel option{color:#111;background:#fff}
.bottom{bottom:0;flex-direction:column;align-items:stretch;gap:6px;padding:48px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(18px,env(safe-area-inset-left,0px));
  background:linear-gradient(transparent,rgba(0,0,0,.72))}
.cap-when{font-size:.8rem;letter-spacing:.08em;opacity:.75;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;gap:12px}
.cap-text{font-family:var(--f-display);font-size:clamp(1.05rem,3.2vw,1.6rem);line-height:1.5;max-width:40ch;text-wrap:pretty;min-height:1.5em;transition:opacity .4s}
.cap-text.swap{opacity:0}
.navz{position:absolute;top:50%;transform:translateY(-50%);z-index:4;width:48px;height:48px;border-radius:50%;
  background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:1.4rem;display:grid;place-items:center;transition:opacity .35s}
.navz.prev{left:max(10px,env(safe-area-inset-left,0px))}
.navz.next{right:max(10px,env(safe-area-inset-right,0px))}
.pbar{position:absolute;left:0;top:0;height:3px;z-index:6;background:var(--foil);width:0}
.pbar.run{animation:pbar linear forwards}
@keyframes pbar{from{width:0}to{width:100%}}
#viewer.hide-ui .chrome.top,#viewer.hide-ui .navz{opacity:0;pointer-events:none}
#viewer.intro-on .chrome,#viewer.intro-on .navz,#viewer.intro-on .pbar{opacity:0;pointer-events:none}
.intro{position:absolute;inset:0;z-index:3;pointer-events:none}
.icard{position:absolute;left:50%;top:50%;background:#f7f6f1;padding:5px 5px 14px;border-radius:4px;box-shadow:0 12px 26px -10px rgba(0,0,0,.8),0 1px 3px rgba(0,0,0,.4);transform-origin:50% 190%;will-change:transform,opacity;opacity:0}
.icard img{width:100%;height:100%;object-fit:cover;display:block;border-radius:2px;background:#ddd}
.skip-hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);text-align:center;font-size:.78rem;opacity:.55;z-index:4;pointer-events:none}
#viewer.polaroid-mode .cap-text{display:none}

/* basic slide track */
.track{position:absolute;inset:0;display:flex;will-change:transform}
.track.anim{transition:transform .42s cubic-bezier(.2,.8,.2,1)}
.sl{flex:0 0 100%;height:100%;margin:0;display:grid;place-items:center;padding:56px 0 120px}
.sl img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none}

/* motion layers */
.layer{position:absolute;inset:0;margin:0;display:grid;place-items:center;padding:56px 12px 120px;backface-visibility:hidden}
.layer img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none}
.layer.cover-fill{padding:0}
.layer.cover-fill img{width:100%;height:100%;max-width:none;max-height:none;object-fit:cover}

.m-fade.in{animation:fadeIn 1.3s ease both}
.m-fade.out{animation:fadeOut 1.3s ease both}
@keyframes fadeIn{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}

.m-kenburns{overflow:hidden}
.m-kenburns img{transform-origin:var(--ox) var(--oy);animation:kb var(--kb) linear both}
.m-kenburns.in{animation:fadeIn 1.6s ease both}
.m-kenburns.out{animation:fadeOut 1.6s ease both}
@keyframes kb{from{transform:scale(var(--s0))}to{transform:scale(var(--s1))}}

.m-zoom.in{animation:zIn 1.1s cubic-bezier(.2,.7,.2,1) both}
.m-zoom.out{animation:zOut 1.1s ease-in both}
@keyframes zIn{from{opacity:0;transform:scale(.7);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes zOut{from{opacity:1;transform:none}to{opacity:0;transform:scale(1.5);filter:blur(6px)}}

.m-flip{transform-origin:left center}
.m-flip.in.fwd{animation:flipInF 1s cubic-bezier(.3,.7,.3,1) both}
.m-flip.out.fwd{animation:flipOutF 1s cubic-bezier(.5,0,.7,.3) both}
.m-flip.in.back{animation:flipInB 1s cubic-bezier(.3,.7,.3,1) both}
.m-flip.out.back{animation:flipOutB 1s cubic-bezier(.5,0,.7,.3) both}
@keyframes flipInF{from{transform:rotateY(70deg);opacity:0}to{transform:none;opacity:1}}
@keyframes flipOutF{from{transform:none;opacity:1}to{transform:rotateY(-80deg);opacity:0}}
@keyframes flipInB{from{transform:rotateY(-70deg);opacity:0}to{transform:none;opacity:1}}
@keyframes flipOutB{from{transform:none;opacity:1}to{transform:rotateY(80deg);opacity:0}}

.m-polaroid{padding:64px 16px 90px}
.pol{background:#f7f6f1;padding:12px 12px 0;box-shadow:0 22px 50px -18px rgba(0,0,0,.85),0 2px 6px rgba(0,0,0,.35);
  transform:rotate(var(--rot));max-width:min(88vw,620px);max-height:100%;display:flex;flex-direction:column}
.pol img{max-height:calc(var(--vh,100dvh) - 300px);min-height:0;object-fit:contain;background:#e9e7df}
.pol p{margin:0;min-height:64px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 6px 10px;
  font-family:var(--f-hand);font-size:clamp(1.5rem,4.6vw,2.1rem);line-height:1.15;color:#2a2a28}
.m-polaroid.in{animation:drop .9s cubic-bezier(.2,.9,.3,1.15) both}
.m-polaroid.under{filter:brightness(.55);transition:filter .8s}
.m-polaroid.gone{animation:fadeOut .8s ease both}
@keyframes drop{from{opacity:0;transform:translateY(-38%) scale(1.15) rotate(var(--rot2))}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  .layer.in,.layer.out,.m-kenburns img,.track.anim{animation-duration:.01s!important;transition-duration:.01s!important}
}
/* ---------- Password gate ---------- */
.gate{max-width:460px;margin:0 auto;padding-block:8vh 40px;display:flex;flex-direction:column;gap:16px}
.gate .cover{padding:40px 22px 30px 44px}
.gate form{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;max-width:150px;position:relative;margin-top:4px}
.gate input{border:1px solid rgba(212,178,100,.6);background:rgba(0,0,0,.22);color:#f6efd9;border-radius:999px;padding:4px 10px;text-align:center;width:100%;min-height:30px;font-size:.8rem}
.gate .btn{min-height:30px;padding:4px 14px;font-size:.8rem}
.gate input::placeholder{color:rgba(246,239,217,.6)}
.gate .err{color:#ffcdbf;font-size:.76rem;min-height:1.2em;margin:0;white-space:nowrap}
.gate .link{background:none;border:0;color:#efe6cf;opacity:.8;text-decoration:underline;font-size:.82rem;padding:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pw-row{display:flex;gap:8px;flex-wrap:wrap}
.pw-row input{flex:1 1 180px;min-width:0}
.hint{color:var(--muted);font-size:.8rem}
/* ---------- Orientation ---------- */
.orient{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 16px;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
#viewer.rot{inset:auto;top:0;left:0;transform-origin:0 0}
#viewer.fill .sl,#viewer.fill .layer:not(.m-polaroid){padding:0}
#viewer.fill .sl img,#viewer.fill .layer:not(.m-polaroid) img{position:absolute;inset:0;z-index:1;width:100%;height:100%;max-width:none;max-height:none;object-fit:contain}
.sl{position:relative;overflow:hidden}
.layer:not(.m-polaroid){overflow:hidden}
.sl::before,.layer:not(.m-polaroid)::before{content:"";position:absolute;inset:-60px;background:var(--bgimg,none) center/cover no-repeat;filter:blur(30px) brightness(.4) saturate(1.1);z-index:0;pointer-events:none}
.sl img,.layer img{position:relative;z-index:1}
#viewer.fill .m-polaroid{padding:12px 8px 16px}
#viewer.fill .m-polaroid .pol img{max-height:calc(var(--vh,100dvh) - 130px)}
.top{flex-wrap:wrap}
.top .ttl{flex:1 1 120px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:999px;font-size:.88rem;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>

<div id="gate" class="gate">
  <header class="cover">
    <div class="frame"></div>
    <div class="logo" id="gateLogo" hidden></div>
    <h1 id="gateTitle">Sketch</h1>
    <p class="meta" id="gateMsg">…</p>
    <form id="gateForm" hidden autocomplete="off" novalidate>
      <label for="gatePw" class="sr">비밀번호</label>
      <input type="password" id="gatePw" placeholder="비밀번호">
      <label for="gatePw2" class="sr">비밀번호 확인</label>
      <input type="password" id="gatePw2" placeholder="한 번 더 입력" hidden>
      <button class="btn primary" type="submit" id="gateGo">앨범 열기</button>

<script>
/* =========================================================
   설정 — Supabase 프로젝트 값으로 바꿔 주세요
   (Supabase 대시보드 → Project Settings → API)
   비워 두면 이 브라우저에만 저장되는 테스트 모드로 동작해요.
   ========================================================= */
const SUPABASE_URL      = '';   // 예: 'https://abcd1234.supabase.co'
const SUPABASE_ANON_KEY = '';   // 예: 'eyJhbGciOi...'
const ALBUM_ID = 'sketch';      // 앨범을 여러 개 만들 때 이름만 바꾸면 돼요
const TABLE    = 'albums';
const BUCKET   = 'album-photos';

(function(){
const $ = s => document.querySelector(s);
let sb = null;

/* ---- 홈 화면 앱 아이콘 + 전체화면 manifest ---- */
(function pwa(){
  try{
    const c=document.createElement('canvas'); c.width=c.height=512; const g=c.getContext('2d');
    const gr=g.createLinearGradient(0,0,512,512); gr.addColorStop(0,'#2c4f45'); gr.addColorStop(1,'#1d3a32');
    g.fillStyle=gr; g.fillRect(0,0,512,512);
    g.strokeStyle='rgba(212,178,100,.7)'; g.lineWidth=6; g.strokeRect(40,40,432,432);
    g.fillStyle='#d4b264'; g.textAlign='center'; g.textBaseline='middle';
    g.font='italic 150px "Great Vibes", "Apple Chancery", "Snell Roundhand", cursive'; g.fillText('Sketch',256,270);
    const icon=c.toDataURL('image/png');
    $('#touchIcon').href=icon;
    const m={name:'Sketch',short_name:'Sketch',display:'fullscreen',orientation:'any',background_color:'#0d0f0e',theme_color:'#1f3a32',
      start_url:location.href.split('#')[0],scope:location.href.replace(/[^/]*$/,''),icons:[{src:icon,sizes:'512x512',type:'image/png',purpose:'any maskable'}]};
    $('#pwaManifest').href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(m));
  }catch(e){}
})();
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isStandalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||(window.matchMedia&&matchMedia('(display-mode: fullscreen)').matches)||navigator.standalone===true;
const MODES = [
  {id:'slide',    name:'기본 넘기기',  desc:'손가락으로 밀어서 한 장씩 넘겨요'},
  {id:'fade',     name:'잔잔한 페이드', desc:'사진이 부드럽게 겹치며 바뀌어요'},
  {id:'kenburns', name:'다큐 줌',      desc:'화면 가득 천천히 다가가며 비춰요'},
  {id:'polaroid', name:'폴라로이드',   desc:'인화한 사진이 손글씨와 함께 놓여요'},
  {id:'flip',     name:'책장 넘김',    desc:'앨범 페이지를 넘기듯 돌아가요'},
  {id:'zoom',     name:'줌 스루',      desc:'사진 속으로 들어가듯 바뀌어요'},
];
const GLYPH = {
  slide:'<i class="g-card" style="left:8%"></i><i class="g-card b" style="left:46%"></i>',
  fade:'<i class="g-card" style="left:28%;opacity:.5"></i><i class="g-card b" style="left:38%;opacity:.7"></i>',
  kenburns:'<i class="g-card" style="left:6%;width:88%;height:80%;top:10%;transform:scale(1.1)"></i>',
  polaroid:'<i class="g-card" style="left:26%;transform:rotate(-8deg);background:var(--surface);border:3px solid var(--surface);border-bottom-width:9px;box-shadow:0 2px 6px rgba(0,0,0,.25)"></i><i class="g-card b" style="left:40%;transform:rotate(6deg);border:3px solid var(--surface);border-bottom-width:9px;box-shadow:0 2px 6px rgba(0,0,0,.25)"></i>',
  flip:'<i class="g-card" style="left:14%"></i><i class="g-card b" style="left:50%;transform:perspective(80px) rotateY(-35deg);transform-origin:left"></i>',
  zoom:'<i class="g-card" style="left:20%;width:60%;height:84%;top:8%;opacity:.35"></i><i class="g-card b" style="left:38%;width:24%;height:40%;top:30%"></i>',
};

/* ---------------- state ---------------- */
let album = blank();
function blank(){ return {title:'Sketch', subtitle:'', logo:null, mode:'fade', pw:null, photos:[]}; }
function normalize(d){
  const a = blank();
  if (!d) return a;
  if (typeof d.title==='string') a.title = d.title==='우리 가족 앨범' ? 'Sketch' : d.title;
  if (typeof d.subtitle==='string') a.subtitle=d.subtitle;
  if (typeof d.logo==='string') a.logo=d.logo;
  if (d.pw && typeof d.pw.hash==='string' && typeof d.pw.salt==='string') a.pw={salt:d.pw.salt,hash:d.pw.hash};
  if (MODES.some(m=>m.id===d.mode)) a.mode=d.mode;
  if (Array.isArray(d.photos)) a.photos = d.photos.filter(p=>p&&typeof p.ref==='string').map(p=>({
    id:String(p.id||uid()), ref:p.ref, caption:String(p.caption||''), when:String(p.when||'')}));
  return a;
}
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
let localMode = null;
try{ localMode = localStorage.getItem('album.mode'); }catch(e){}

/* ---------------- tiny IndexedDB (fallback storage) ---------------- */
const IDB = {
  db:null,
  open(){ return new Promise((res,rej)=>{ const r=indexedDB.open('family-album',1);
    r.onupgradeneeded=()=>{ r.result.createObjectStore('meta'); r.result.createObjectStore('blobs'); };
    r.onsuccess=()=>{this.db=r.result;res();}; r.onerror=()=>rej(r.error); }); },
  tx(store,mode,fn){ return new Promise((res,rej)=>{ const t=this.db.transaction(store,mode); const s=t.objectStore(store);
    const r=fn(s); t.oncomplete=()=>res(r&&r.result); t.onerror=()=>rej(t.error); }); },
  get(st,k){ return this.tx(st,'readonly',s=>s.get(k)); },
  put(st,k,v){ return this.tx(st,'readwrite',s=>s.put(v,k)); },
  del(st,k){ return this.tx(st,'readwrite',s=>s.delete(k)); },
  all(st){ return new Promise((res,rej)=>{ const out={}; const t=this.db.transaction(st,'readonly');
    const c=t.objectStore(st).openCursor(); c.onsuccess=()=>{const cur=c.result; if(cur){out[cur.key]=cur.value;cur.continue();}};
    t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); }); }
};

/* ---------------- storage adapter: shared (claude.ai) or this browser ---------------- */
const Store = {
  kind:'none', canEdit:true, urls:{}, saving:false, pending:false, dirty:false,
  async init(){
    if (SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase){
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      this.kind='cloud';
      try{ const {data}=await sb.auth.getSession(); this.canEdit=!!(data&&data.session); }catch(e){ this.canEdit=false; }
      const {data,error}=await sb.from(TABLE).select('data').eq('id',ALBUM_ID).maybeSingle();
      if (error) toast('앨범을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.');
      album = normalize(data && data.data);
      return;
    }
    try{
      await IDB.open(); this.kind='local';
      const blobs = await IDB.all('blobs');
      for (const k in blobs) this.urls['local:'+k] = URL.createObjectURL(blobs[k]);
      album = normalize(await IDB.get('meta','album'));
    }catch(e){ this.kind='memory'; }
  },
  url(ref){ if(!ref) return ''; if(ref.startsWith('data:')) return ref; if(ref.startsWith('sb:')&&sb) return sb.storage.from(BUCKET).getPublicUrl(ref.slice(3)).data.publicUrl; if(this.urls[ref]) return this.urls[ref]; if(ref.startsWith('local:')||ref.startsWith('mem:')) return ''; return '/_blob/'+ref; },
  async putImage(blob){
    if (this.kind==='cloud'){ const path=`${ALBUM_ID}/${Date.now().toString(36)}-${uid()}.jpg`;
      const {error}=await sb.storage.from(BUCKET).upload(path,blob,{contentType:'image/jpeg',cacheControl:'31536000',upsert:false});
      if (error) throw {code:(error.statusCode==='403'||/row-level|policy|Unauthorized/i.test(error.message))?'not_admin':'upload_failed',message:error.message};
      return 'sb:'+path; }
    const key = uid();
    if (this.kind==='local'){ await IDB.put('blobs',key,blob); this.urls['local:'+key]=URL.createObjectURL(blob); return 'local:'+key; }
    this.urls['mem:'+key]=URL.createObjectURL(blob); return 'mem:'+key;
  },
  async removeImage(ref){
    try{
      if (!ref) return;
      if (ref.startsWith('local:')) await IDB.del('blobs',ref.slice(6));
      else if (ref.startsWith('sb:') && sb) await sb.storage.from(BUCKET).remove([ref.slice(3)]);
    }catch(e){}
  },
  schedule(){ this.dirty=true; setSave('저장 중…'); clearTimeout(this.t); this.t=setTimeout(()=>this.flush(),700); },
  async flush(){
    clearTimeout(this.t);
    if (this.saving){ this.pending=true; return; }
    this.saving=true;
    const data = JSON.parse(JSON.stringify(album));
    try{
      if (this.kind==='cloud'){ const {error}=await sb.from(TABLE).upsert({id:ALBUM_ID,data,updated_at:new Date().toISOString()}); if(error) throw {code:/row-level|policy|JWT/i.test(error.message)?'invalid_argument':'save_failed',message:error.message}; }
      else if (this.kind==='local') await IDB.put('meta','album',data);
      setSave(this.kind==='memory' ? '이 창을 닫으면 사라져요' : '저장됨');
    }catch(e){
      if (e && e.code==='invalid_argument'){ this.canEdit=false; toast('편집 권한이 없어 저장되지 않았어요.'); closeEditor(); }
      else { setSave('저장 실패 · 다시 시도'); toast('저장하지 못했어요. 잠시 후 다시 시도해 주세요.'); }
    }
    this.saving=false;
    if (this.pending){ this.pending=false; return this.flush(); }
    this.dirty=false;
  }
};
function setSave(t){ $('#saveState').textContent=t; }

/* ---------------- image prep ---------------- */
async function prepImage(file, max){
  let src;
  try{ src = await createImageBitmap(file,{imageOrientation:'from-image'}); }
  catch(e){ src = await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=URL.createObjectURL(file); }); }
  const w=src.width, h=src.height, k=Math.min(1,max/Math.max(w,h));
  const c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k);
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  return await new Promise(res=>c.toBlob(res,'image/jpeg',.86));
}

/* ---------------- toast ---------------- */
let toastT;
function toast(msg){
  let el=$('.toast'); if(!el){ el=document.createElement('div'); el.className='toast'; el.setAttribute('role','status'); document.body.appendChild(el); }
  el.textContent=msg; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,3200);
}

/* ---------------- home ---------------- */
function currentMode(){ return localMode && MODES.some(m=>m.id===localMode) ? localMode : album.mode; }
function logoInto(el){
  el.textContent='';
  if (album.logo){ const im=document.createElement('img'); im.src=Store.url(album.logo); im.alt='앨범 로고'; el.appendChild(im); }
  el.hidden = !album.logo && el.id!=='edLogo';
  if (!album.logo && el.id==='edLogo'){ const s=document.createElement('span'); s.textContent='없음'; s.style.fontSize='.85rem'; el.appendChild(s); }
}
function renderHome(){
  logoInto($('#coverLogo'));
  $('#coverTitle').textContent = album.title || 'Sketch';
  $('#coverSub').textContent = album.subtitle; $('#coverSub').hidden = !album.subtitle;
  const n = album.photos.length;
  $('#coverMeta').textContent = n ? `사진 ${n}장` : '아직 사진이 없어요';
  $('#playBtn').disabled = !n;
  $('#editBtn').hidden = !Store.canEdit;
  $('#lockBtn').hidden = !album.pw;
  $('#localNote').hidden = Store.kind!=='local';
  $('#thumbCount').textContent = n ? `${n}장 · 누르면 그 사진부터 봐요` : '';
  const box=$('#thumbs'); box.textContent='';
  if (!n){
    const e=document.createElement('div'); e.className='empty';
    e.innerHTML = Store.canEdit
      ? '<span>사진을 올리고 한 장 한 장에 그때의 이야기를 적어 보세요.</span><button class="btn primary" type="button">첫 사진 올리기</button>'
      : '<span>앨범지기가 사진을 준비하고 있어요.</span>';
    const b=e.querySelector('button'); if(b) b.onclick=openEditor;
    box.appendChild(e); return;
  }
  const g=document.createElement('div'); g.className='thumbs';
  album.photos.forEach((p,i)=>{
    const b=document.createElement('button'); b.type='button'; b.className='thumb';
    b.setAttribute('aria-label',`${i+1}번째 사진 보기${p.caption?': '+p.caption:''}`);
    const im=document.createElement('img'); im.loading='lazy'; im.src=Store.url(p.ref); im.alt='';
    const s=document.createElement('span'); s.textContent=p.when || String(i+1);
    b.append(im,s); b.onclick=()=>openViewer(i); g.appendChild(b);
  });
  box.appendChild(g);
}
function renderModes(){
  const box=$('#modes'); box.textContent='';
  const cur=currentMode();
  MODES.forEach(m=>{
    const l=document.createElement('label'); l.className='mode';
    l.innerHTML=`<input type="radio" name="mode" id="mode-${m.id}" value="${m.id}"><div class="glyph" aria-hidden="true">${GLYPH[m.id]}</div><b></b><small></small>`;
    l.querySelector('b').textContent=m.name; l.querySelector('small').textContent=m.desc;
    const inp=l.querySelector('input'); inp.checked = m.id===cur;
    inp.onchange=()=>setMode(m.id);
    box.appendChild(l);
  });
  const sel=$('#vMode'); sel.textContent='';
  MODES.forEach(m=>{ const o=document.createElement('option'); o.value=m.id; o.textContent=m.name; sel.appendChild(o); });
  sel.value=cur;
}
function setMode(id){
  localMode=id; try{ localStorage.setItem('album.mode',id); }catch(e){}
  if (Store.canEdit && album.mode!==id){ album.mode=id; Store.schedule(); }
  const r=document.getElementById('mode-'+id); if(r) r.checked=true;
  $('#vMode').value=id;
}

/* ---------------- editor ---------------- */
let editorStale=false;
function openEditor(){
  if (!Store.canEdit) return;
  $('#home').hidden=true; $('#editor').hidden=false; document.body.classList.add('editing');
  $('#inTitle').value=album.title; $('#inSub').value=album.subtitle;
  renderEditor(); window.scrollTo(0,0);
}
function closeEditor(){
  if (Store.dirty) Store.flush();
  $('#editor').hidden=true; $('#home').hidden=false; document.body.classList.remove('editing');
  renderHome(); window.scrollTo(0,0);
}
function renderEditor(){
  logoInto($('#edLogo'));
  $('#logoDel').hidden=!album.logo;
  $('#edCount').textContent = album.photos.length ? `${album.photos.length}장` : '';
  const list=$('#plist'); list.textContent='';
  album.photos.forEach((p,i)=>{
    const li=document.createElement('li'); li.className='prow'; li.dataset.id=p.id;
    li.innerHTML=`<span class="num">${i+1}</span>
      <button class="pimg" type="button" aria-label="이 사진부터 미리 보기"><img alt="" loading="lazy"></button>
      <div class="pfields">

        <div class="field"><label for="c-${p.id}">사진 이야기</label><textarea id="c-${p.id}" maxlength="300" placeholder="이 사진에 담긴 이야기를 적어 주세요"></textarea></div>
        <div class="tools">

          <button class="tool del" type="button" data-a="del">삭제</button>
        </div>
      </div>`;
    li.querySelector('img').src=Store.url(p.ref);
    li.querySelector('.pimg').onclick=()=>openViewer(i);
    const w=li.querySelector('input'), c=li.querySelector('textarea');
    w.value=p.when; c.value=p.caption;
    w.oninput=()=>{ p.when=w.value; Store.schedule(); };
    c.oninput=()=>{ p.caption=c.value; Store.schedule(); };
    li.querySelector('.tools').onclick=e=>{
      const b=e.target.closest('button'); if(!b) return;
      const a=b.dataset.a, idx=album.photos.indexOf(p);
      if (a==='up'&&idx>0){ [album.photos[idx-1],album.photos[idx]]=[album.photos[idx],album.photos[idx-1]]; Store.schedule(); renderEditor(); focusRow(p.id,'up'); }
      if (a==='down'&&idx<album.photos.length-1){ [album.photos[idx+1],album.photos[idx]]=[album.photos[idx],album.photos[idx+1]]; Store.schedule(); renderEditor(); focusRow(p.id,'down'); }
      if (a==='del'){
        if (!b.classList.contains('confirm')){ b.classList.add('confirm'); b.textContent='정말 삭제'; setTimeout(()=>{ if(b.isConnected){b.classList.remove('confirm'); b.textContent='삭제';} },3500); return; }
        album.photos.splice(idx,1); renderEditor();
        Store.schedule(); Store.flush().then(()=>Store.removeImage(p.ref)); toast('사진을 삭제했어요.');
      }
    };
    list.appendChild(li);
  });
}

function blobToDataUrl(b){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(b); }); }
function uploadMsg(err){

  if (c==='quota_or_state') return '앨범 저장 공간이 가득 찼어요. 쓰지 않는 사진을 지워 주세요.';
  if (c==='rate_limited') return '사진을 너무 빨리 올리고 있어요. 잠시 뒤 다시 올려 주세요.';
  if (c==='too_large') return '사진이 너무 커요. 더 작은 사진으로 올려 주세요.';
  return '사진을 올리지 못했어요. 잠시 뒤 다시 시도해 주세요.'+(c?' ('+c+')':'');
}
async function addFiles(files){

/* ---------------- viewer ---------------- */
const V={i:0,mode:'slide',playing:false,timer:null,interval:6,lock:null,uiT:null};
const viewer=$('#viewer'), stage=$('#stage');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

function openViewer(i,withIntro){
  if (!album.photos.length) return;
  V.i=Math.max(0,Math.min(i||0,album.photos.length-1));
  V.mode=currentMode();
  viewer.hidden=false; document.body.classList.add('viewing');
  $('#vTitle').textContent=album.title; $('#vMode').value=V.mode;
  applyFit();
  try{ navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>V.lock=l).catch(()=>{}); }catch(e){}
  tryLock(); applyOrient();
  V.playing=false; syncPlay();
  if (withIntro && !reduce && album.photos.length>1){
    stage.textContent=''; viewer.classList.add('intro-on');
    playIntro().then(()=>{
      introRun=null; viewer.classList.remove('intro-on');
      if (viewer.hidden) return;
      build(); const l=stage.querySelector('.layer'); if(l) l.classList.add('in');
      pokeUI();
    });
  } else build();
  pokeUI();
  $('#vNext').focus({preventScroll:true});
}
function closeViewer(){
  if (introRun) introRun.skip();
  stopTimer(); viewer.hidden=true; document.body.classList.remove('viewing'); stage.textContent='';
  try{ V.lock&&V.lock.release(); }catch(e){} V.lock=null;
  resetOrient();
  if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
}
function build(){
  stage.textContent=''; viewer.classList.toggle('polaroid-mode',V.mode==='polaroid');
  if (V.mode==='slide'){
    const t=document.createElement('div'); t.className='track'; t.id='track';
    album.photos.forEach((p,k)=>{ const f=document.createElement('figure'); f.className='sl';
      const im=document.createElement('img'); im.alt=p.caption||`${k+1}번째 사진`; im.decoding='async';
      if (Math.abs(k-V.i)<=2){ im.src=Store.url(p.ref); f.style.setProperty('--bgimg',`url("${im.src}")`); } else im.dataset.src=Store.url(p.ref);
      f.appendChild(im); t.appendChild(f); });
    stage.appendChild(t); placeTrack(false);
  } else showLayer(0,true);
  caption(true);
}
function placeTrack(anim,dx=0){
  const t=$('#track'); if(!t) return;
  t.classList.toggle('anim',anim);
  t.style.transform=`translateX(calc(${-V.i*100}% + ${dx}px))`;
  [...t.children].forEach((f,k)=>{ const im=f.firstChild; if(Math.abs(k-V.i)<=2&&im.dataset.src){ im.src=im.dataset.src; f.style.setProperty('--bgimg',`url("${im.dataset.src}")`); delete im.dataset.src; } });
}
function makeLayer(p,dir){
  const f=document.createElement('figure'); f.className='layer m-'+V.mode;
  const im=document.createElement('img'); im.src=Store.url(p.ref); im.alt=p.caption||'사진'; im.decoding='async';
  if (V.mode==='polaroid'){
    const r=(Math.random()*10-5).toFixed(1);
    f.style.setProperty('--rot',r+'deg'); f.style.setProperty('--rot2',(r*2.4).toFixed(1)+'deg');
    const card=document.createElement('div'); card.className='pol';
    const cap=document.createElement('p'); cap.textContent=p.caption||p.when||'';
    card.append(im,cap); f.appendChild(card);
  } else {
    if (V.mode==='kenburns'){
      const z=Math.random()<.5; f.style.setProperty('--s0',z?.9:1); f.style.setProperty('--s1',z?1:.9);
      f.style.setProperty('--ox',(20+Math.random()*60).toFixed(0)+'%'); f.style.setProperty('--oy',(20+Math.random()*60).toFixed(0)+'%');
      f.style.setProperty('--kb',(V.interval+2)+'s');
    }
    if (V.mode==='flip') f.classList.add(dir<0?'back':'fwd');
    f.style.setProperty('--bgimg',`url("${im.src}")`);
    f.appendChild(im);
  }
  return f;
}
function showLayer(dir,first){
  const p=album.photos[V.i];
  const olds=[...stage.querySelectorAll('.layer:not(.gone)')];
  const nf=makeLayer(p,dir);
  if (!first) nf.classList.add('in');
  stage.appendChild(nf);
  if (V.mode==='polaroid'){
    olds.forEach(o=>{ o.classList.remove('in'); o.classList.add('under'); });
    const all=[...stage.querySelectorAll('.layer:not(.gone)')];
    all.slice(0,Math.max(0,all.length-3)).forEach(o=>{ o.classList.add('gone'); setTimeout(()=>o.remove(),900); });
  } else {
    olds.forEach(o=>{ o.classList.remove('in','fwd','back'); if(V.mode==='flip') o.classList.add(dir<0?'back':'fwd'); o.classList.add('out','gone'); setTimeout(()=>o.remove(),1700); });
  }
  const nx=album.photos[(V.i+1)%album.photos.length]; if(nx){ const pre=new Image(); pre.src=Store.url(nx.ref); }
}
function caption(instant){
  const p=album.photos[V.i]; if(!p) return;
  $('#vWhen').textContent=p.when||'';
  $('#vIdx').textContent=`${V.i+1} / ${album.photos.length}`;
  const c=$('#vCap');
  if (instant){ c.textContent=p.caption; return; }
  c.classList.add('swap'); setTimeout(()=>{ c.textContent=p.caption; c.classList.remove('swap'); },260);
}
function go(step,auto){
  const n=album.photos.length; let j=V.i+step;
  if (j<0||j>=n){ if(!auto){ if(V.mode==='slide') placeTrack(true); return; } j=(j+n)%n; }
  V.i=j;
  if (V.mode==='slide') placeTrack(true); else showLayer(step);
  caption(false);
  if (V.playing) startTimer();
}
function startTimer(){
  stopTimer(); if(!V.playing) return;
  V.timer=setTimeout(()=>go(1,true),V.interval*1000);
  const b=$('#pbar'); b.classList.remove('run'); void b.offsetWidth; b.style.animationDuration=V.interval+'s'; b.classList.add('run');
}
function stopTimer(){ clearTimeout(V.timer); const b=$('#pbar'); b.classList.remove('run'); b.style.width='0'; }
function syncPlay(){ const b=$('#vPlay'); b.textContent=V.playing?'❚❚':'▶'; b.setAttribute('aria-label',V.playing?'자동 넘김 멈추기':'자동 넘김 시작'); V.playing?startTimer():stopTimer(); }
function pokeUI(){ viewer.classList.remove('hide-ui'); clearTimeout(V.uiT); V.uiT=setTimeout(()=>{ viewer.classList.add('hide-ui'); },3000); }

/* ---------------- intro: deal, fan, gather ---------------- */
let introRun=null;
async function playIntro(){
  const ps=album.photos.slice(0,28), n=ps.length;
  const W=stage.clientWidth||innerWidth, H=stage.clientHeight||innerHeight;
  const cw=Math.round(Math.min(W*0.3,H*0.24,170)), ch=Math.round(cw*1.3);
  const ov=document.createElement('div'); ov.className='intro';
  const hint=document.createElement('div'); hint.className='skip-hint'; hint.textContent='화면을 누르면 바로 시작해요';
  stage.append(ov,hint);
  const cards=[];
  for (let k=n-1;k>=0;k--){
    const c=document.createElement('div'); c.className='icard';
    c.style.width=cw+'px'; c.style.height=ch+'px'; c.style.marginLeft=(-cw/2)+'px'; c.style.marginTop=(-ch/2)+'px';
    const im=document.createElement('img'); im.src=Store.url(ps[k].ref); im.alt=''; c.appendChild(im);
    ov.appendChild(c); cards[k]=c;
  }
  const anims=[]; let skipped=false;
  introRun={ skip(){ skipped=true; anims.forEach(a=>{ try{a.finish();}catch(e){} }); } };
  const run=(el,kf,opt)=>{ const a=el.animate(kf,Object.assign({fill:'forwards',easing:'cubic-bezier(.2,.8,.2,1)'},opt)); anims.push(a); return a.finished.catch(()=>{}); };
  const wait=ms=>new Promise(r=>setTimeout(r,skipped?0:ms));
  const j=()=>(Math.random()*6-3).toFixed(1);
  const rest=cards.map(()=>`translate(${j()}px,${j()}px) rotate(${j()}deg)`);
  const spread=Math.min(130,10+12*n);
  const fan=cards.map((_,i)=>`translate(0px,0px) rotate(${(-spread/2+spread*i/(n-1)).toFixed(1)}deg)`);
  const phases=[
    ()=>Promise.all(cards.map((c,i)=>run(c,[
      {transform:`translate(${((Math.random()-.5)*W*.7).toFixed(0)}px,${(H*.8).toFixed(0)}px) rotate(${((Math.random()-.5)*120).toFixed(0)}deg)`,opacity:0},
      {transform:rest[i],opacity:1}],{duration:520,delay:(n-1-i)*Math.max(18,420/n)}))),
    ()=>wait(180),
    ()=>Promise.all(cards.map((c,i)=>run(c,[{transform:rest[i],opacity:1},{transform:fan[i],opacity:1}],{duration:620,delay:i*Math.max(12,260/n)}))),
    ()=>wait(650),
    ()=>Promise.all(cards.map((c,i)=>run(c,[{transform:fan[i],opacity:1},{transform:'translate(0px,0px) rotate(0deg)',opacity:1}],{duration:460,delay:(n-1-i)*Math.max(10,200/n),easing:'cubic-bezier(.6,0,.4,1)'}))),
    ()=>wait(220),
    ()=>{ const s=(Math.min(W/cw,H/ch)*0.92).toFixed(2);
      cards.slice(1).forEach(c=>run(c,[{opacity:1},{opacity:0}],{duration:280}));
      return run(cards[0],[{transform:'translate(0px,0px) scale(1)',opacity:1},{transform:`translate(0px,0px) scale(${s})`,opacity:0}],{duration:650,easing:'cubic-bezier(.4,0,.2,1)'}); },
  ];
  for (const p of phases){ if (skipped) break; await p(); }
  ov.remove(); hint.remove();
}

}

/* ---------------- password gate ---------------- */
let unlocked=false, gateMode='login';
async function hashPw(pw,salt){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pw));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function remember(h){ try{ localStorage.setItem('album.key',h); }catch(e){} }
function renderGateCover(){ logoInto($('#gateLogo')); $('#gateTitle').textContent=album.title||'Sketch'; }
function showGate(mode){
  gateMode=mode; renderGateCover();
  $('#gate').hidden=false; $('#home').hidden=true;
  const f=$('#gateForm'); f.hidden=false; f.reset(); $('#gateErr').textContent='';
  const create=mode==='create';
  $('#gateMsg').hidden = true;
  $('#gatePw').placeholder = create ? '새 비밀번호 (4자 이상)' : '비밀번호';
  $('#gatePw').autocomplete = create ? 'new-password' : 'current-password';
  $('#gatePw2').hidden=!create;
  $('#gateGo').textContent = create ? '만들기' : '열기';
  $('#gateReset').hidden = create || !Store.canEdit;
  setTimeout(()=>$('#gatePw').focus(),50);
}
function showApp(){ unlocked=true; $('#gate').hidden=true; $('#home').hidden=false; refresh(); }
function decideGate(){
  if (album.pw){
    let k=null; try{ k=localStorage.getItem('album.key'); }catch(e){}
    if (k===album.pw.hash) return showApp();
    return showGate('login');
  }
  if (Store.canEdit) return showGate('create');
  showApp();
}
async function setPassword(pw){
  const salt=uid(), hash=await hashPw(pw,salt);
  album.pw={salt,hash}; Store.schedule(); await Store.flush(); remember(hash);
}
$('#gateForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const pw=$('#gatePw').value.trim(), err=$('#gateErr');
  if (!pw){ err.textContent='비밀번호를 입력해 주세요.'; return; }
  if (gateMode==='login'){
    if (!album.pw) return showApp();
    const h=await hashPw(pw,album.pw.salt);
    if (h===album.pw.hash){ remember(h); showApp(); }
    else { err.textContent='비밀번호가 맞지 않아요. 다시 입력해 주세요.'; $('#gatePw').select(); }
    return;
  }
  if (pw.length<4){ err.textContent='4자 이상으로 만들어 주세요.'; return; }
  if (pw!==$('#gatePw2').value.trim()){ err.textContent='두 번 입력한 비밀번호가 달라요.'; return; }
  await setPassword(pw); showApp(); toast('비밀번호를 만들었어요. 가족에게 알려 주세요.');
});
$('#gateReset').onclick=()=>showGate('create');
$('#lockBtn').onclick=()=>{
  try{ localStorage.removeItem('album.key'); }catch(e){}
  unlocked=false;
  if (!$('#editor').hidden){ $('#editor').hidden=true; document.body.classList.remove('editing'); }
  showGate('login'); window.scrollTo(0,0);
};
$('#pwSave').onclick=async()=>{
  const v=$('#inPw').value.trim();
  if (v.length<4){ toast('비밀번호는 4자 이상으로 만들어 주세요.'); return; }
  await setPassword(v); $('#inPw').value=''; toast('비밀번호를 바꿨어요. 가족에게 새 비밀번호를 알려 주세요.');
};

/* ---------------- orientation ---------------- */
const ORIENTS=[{id:'auto',name:'자동'},{id:'land',name:'가로'},{id:'port',name:'세로'}];
V.orient='auto'; V.rot=false;
try{ const o=localStorage.getItem('album.orient'); if(ORIENTS.some(x=>x.id===o)) V.orient=o; }catch(e){}
function renderOrient(){
  const seg=$('#orientSeg'); seg.textContent='';
  ORIENTS.forEach(o=>{ const b=document.createElement('button'); b.type='button'; b.textContent=o.name;
    b.setAttribute('aria-pressed',String(o.id===V.orient)); b.onclick=()=>setOrient(o.id); seg.appendChild(b); });
  const cur=ORIENTS.find(o=>o.id===V.orient);
  $('#vOrient').textContent='⟳ '+cur.name;
  $('#vOrient').setAttribute('aria-label','화면 방향 '+cur.name+', 눌러서 바꾸기');
}
function setOrient(id){
  V.orient=id; try{ localStorage.setItem('album.orient',id); }catch(e){}
  renderOrient(); if (!viewer.hidden){ tryLock(); applyOrient(); }
}
function tryLock(){
  try{
    const so=screen.orientation; if(!so) return;
    if (V.orient==='auto'){ if(so.unlock) so.unlock(); return; }
    if (so.lock) so.lock(V.orient==='land'?'landscape':'portrait').then(()=>setTimeout(applyOrient,300)).catch(()=>{});
  }catch(e){}
}
function applyOrient(){
  const W=innerWidth, H=innerHeight, isLand=W>H;
  const rot = V.orient!=='auto' && ((V.orient==='land')!==isLand);
  V.rot=rot; viewer.classList.toggle('rot',rot);
  if (rot){ viewer.style.width=H+'px'; viewer.style.height=W+'px'; viewer.style.transform=`translateX(${W}px) rotate(90deg)`; }
  else { viewer.style.width=''; viewer.style.height=''; viewer.style.transform=''; }
  viewer.style.setProperty('--vh',(rot?W:H)+'px');
  if (V.mode==='slide') placeTrack(false);
}
function resetOrient(){
  V.rot=false; viewer.classList.remove('rot'); viewer.style.width=''; viewer.style.height=''; viewer.style.transform='';
  try{ if(screen.orientation&&screen.orientation.unlock) screen.orientation.unlock(); }catch(e){}
}
function loc(e){ const X=e.clientX-sx, Y=e.clientY-sy; return V.rot?[Y,-X]:[X,Y]; }
addEventListener('resize',()=>{ if(!viewer.hidden) applyOrient(); });
$('#vOrient').onclick=()=>{ const i=ORIENTS.findIndex(o=>o.id===V.orient); setOrient(ORIENTS[(i+1)%ORIENTS.length].id); pokeUI(); };
renderOrient();

/* ---------------- boot ---------------- */
function refresh(){
  if (!unlocked){ renderGateCover(); return; }
  renderModes(); renderHome(); renderAdmin();
  if (!$('#editor').hidden){
    if (document.activeElement && $('#editor').contains(document.activeElement)) editorStale=true;
    else renderEditor();
  }
}
document.addEventListener('focusout',()=>{ if(editorStale){ setTimeout(()=>{ if(!$('#editor').contains(document.activeElement)){ editorStale=false; renderEditor(); } },50); } });
renderModes();
Store.init().then(()=>{
  if (Store.kind==='memory'){ $('#localNote').hidden=false; $('#localNote').textContent='이 화면에서는 저장소를 쓸 수 없어 창을 닫으면 앨범이 사라져요.'; }
  decideGate();
  if (Store.kind==='memory') $('#localNote').hidden=false;
});
})();
</script>
